<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — HBS Participation Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <div>
        <h1>Participation Dashboard</h1>
        <p class="subtitle">How you're doing this week, and overall.</p>
      </div>
      <nav class="page-nav">
        <a class="nav-link" href="index.html">Log</a>
        <a class="nav-link" href="dashboard.html" aria-current="page">Dashboard</a>
      </nav>
    </div>
  </header>

  <section class="card" id="empty-dashboard" hidden>
    <p class="empty-state">No entries yet. Add some in the <a href="index.html">log</a> to see your stats here.</p>
  </section>

  <div id="dashboard-content" hidden>
    <section class="card">
      <div class="section-header">
        <h2>This week</h2>
        <span class="section-sub" id="week-range"></span>
      </div>
      <div class="stats" id="week-stats"></div>
      <div class="chart-block">
        <div class="chart-title-row">
          <h3>Entries by day</h3>
          <div class="legend" id="week-legend"></div>
        </div>
        <div id="week-chart" class="chart"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-header">
        <h2>Overall</h2>
        <span class="section-sub" id="overall-range"></span>
      </div>
      <div class="stats" id="overall-stats"></div>

      <div class="chart-block">
        <div class="chart-title-row">
          <h3>Entries per week</h3>
        </div>
        <div id="trend-chart" class="chart"></div>
      </div>

      <div class="chart-grid">
        <div class="chart-block">
          <div class="chart-title-row">
            <h3>By class</h3>
          </div>
          <div id="class-chart" class="chart"></div>
        </div>
        <div class="chart-block">
          <div class="chart-title-row">
            <h3>Voluntary breakdown</h3>
          </div>
          <div id="subtype-chart" class="chart"></div>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="dashboard.js"></script>
</body>
</html>
