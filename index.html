<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HBS Participation Log</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a51c30">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Participation">
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <div>
        <h1>HBS Participation Log</h1>
        <p class="subtitle">Track your own class contributions across courses.</p>
      </div>
      <nav class="page-nav">
        <a class="nav-link" href="index.html" aria-current="page">Log</a>
        <a class="nav-link" href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="card">
    <h2>Quick log</h2>
    <p class="quick-hint" id="quick-hint">Tap a class, then a type. Logs today.</p>

    <div class="chip-row" id="quick-classes"></div>

    <div class="quick-new-class" id="quick-new-class-wrap" hidden>
      <input type="text" id="quick-new-class-input" placeholder="New class name">
      <button type="button" class="btn small" id="quick-new-class-save">Add</button>
      <button type="button" class="btn small" id="quick-new-class-cancel">Cancel</button>
    </div>

    <div class="quick-types" id="quick-types" hidden>
      <div class="quick-selected" id="quick-selected-class"></div>
      <div class="chip-row">
        <button type="button" class="chip type-chip" data-type="Cold-call">Cold-call</button>
        <button type="button" class="chip type-chip" data-type="Voluntary">Voluntary</button>
        <button type="button" class="chip type-chip" data-type="No participation">Didn't speak</button>
        <button type="button" class="chip chip-ghost" id="quick-cancel-class">Cancel</button>
      </div>
      <div class="chip-row" id="quick-subtypes" hidden>
        <button type="button" class="chip subtype-chip" data-subtype="Superficial">Superficial</button>
        <button type="button" class="chip subtype-chip" data-subtype="Quality comment">Quality comment</button>
        <button type="button" class="chip subtype-chip" data-subtype="Calculation walkthrough">Calculation walkthrough</button>
      </div>
    </div>

    <p class="quick-confirm" id="quick-confirm" hidden></p>
  </section>

  <details class="card">
    <summary>Backdate or add notes</summary>
    <form id="entry-form">
      <div class="field-row">
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="field">
          <label for="class-name">Class / Course</label>
          <input type="text" id="class-name" list="class-options" placeholder="e.g. FIN1, Strategy" required>
          <datalist id="class-options"></datalist>
        </div>
      </div>

      <div class="field">
        <label>Type</label>
        <div class="radio-row">
          <label class="radio"><input type="radio" name="type" value="Cold-call" checked> Cold-call</label>
          <label class="radio"><input type="radio" name="type" value="Voluntary"> Voluntary</label>
          <label class="radio"><input type="radio" name="type" value="No participation"> Didn't speak</label>
        </div>
      </div>

      <div class="field" id="subtype-field" hidden>
        <label for="subtype">Voluntary type</label>
        <select id="subtype">
          <option value="">Select one…</option>
          <option value="Superficial">Superficial</option>
          <option value="Quality comment">Quality comment</option>
          <option value="Calculation walkthrough">Calculation walkthrough</option>
        </select>
      </div>

      <div class="field">
        <label for="notes">Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="What did you say?"></textarea>
      </div>

      <button type="submit" class="btn primary">Add entry</button>
    </form>
  </details>

  <section class="card">
    <div class="log-header">
      <h2>Log</h2>
      <div class="filters">
        <select id="filter-class">
          <option value="">All classes</option>
        </select>
        <select id="filter-type">
          <option value="">All types</option>
          <option value="Cold-call">Cold-call</option>
          <option value="Voluntary">Voluntary</option>
          <option value="No participation">Didn't speak</option>
        </select>
        <button type="button" class="btn" id="export-btn">Export CSV</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="log-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Class</th>
            <th>Type</th>
            <th>Notes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
      <p id="empty-state" class="empty-state" hidden>No entries yet — add your first one above.</p>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
